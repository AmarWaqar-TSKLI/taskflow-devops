sonar.organization=amarwaqar-tskli
sonar.projectKey=AmarWaqar-TSKLI_taskflow-devops
sonar.projectName=taskflow-devops

# SonarCloud analyses the whole repo; mark tests and exclude generated/vendor folders.
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,docs/**
sonar.test.inclusions=services/*/tests/**
sonar.javascript.lcov.reportPaths=services/backend/coverage/lcov.info,services/frontend/coverage/lcov.info
# Coverage counts application code only: entry points, configs, build script and k6 script are not unit-tested.
sonar.coverage.exclusions=services/backend/src/server.js,services/frontend/src/main.js,**/*.config.js,services/frontend/build.js,loadtest/**,monitoring/**,scripts/**,infra/**

# Accepted finding (see SECURITY.md): the ALB listens on HTTP only, there is no domain/ACM certificate.
sonar.issue.ignore.multicriteria=albhttp
sonar.issue.ignore.multicriteria.albhttp.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.albhttp.resourceKey=infra/alb.sh
