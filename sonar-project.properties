sonar.organization=amarwaqar-tskli
sonar.projectKey=AmarWaqar-TSKLI_taskflow-devops
sonar.projectName=taskflow-devops

sonar.sources=services/backend/src,services/frontend/src,scripts,infra,.github/workflows
sonar.tests=services/backend/tests,services/frontend/tests
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**
sonar.javascript.lcov.reportPaths=services/backend/coverage/lcov.info,services/frontend/coverage/lcov.info
# Entry points with no logic worth unit-testing (same exclusions as jest.config.js)
sonar.coverage.exclusions=services/backend/src/server.js,services/frontend/src/main.js
