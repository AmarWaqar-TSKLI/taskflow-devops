# TaskFlow frontend server (nginx-unprivileged, port 8080).
# Copied to /etc/nginx/conf.d/default.conf, so it lives inside the image's http {} block.
#   GET /health  -> 200 ok        (ALB target group taskflow-tg-frontend health check)
#   /api/...     -> backend:3000  (Compose network; on AWS the ALB sends /api/* to the backend directly)
#   anything else -> static files from dist/, unknown paths fall back to index.html

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Resolve "backend" through Docker's DNS at request time instead of at startup,
    # so nginx starts (and /health passes) even while the backend is still starting.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:3000;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
